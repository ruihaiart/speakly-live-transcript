<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="shared.css"><script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  @keyframes pulse { 0%,100%{opacity:0.3;transform:scale(1)} 50%{opacity:0.6;transform:scale(1.08)} }
  .pulse-anim { animation: pulse 2s infinite; }
</style>
</head>
<body>
<div class="app-window">
  <div class="window-controls">
    <div class="tl tl-r"></div><div class="tl tl-y"></div><div class="tl tl-g"></div>
  </div>
  <div class="workspace">
    <div class="sidebar">
      <div class="sidebar-top">
        <div class="logo-area">
          <div class="logo-icon"><div class="logo-bars"><div class="bar" style="height:5px"></div><div class="bar" style="height:9px"></div><div class="bar" style="height:7px"></div><div class="bar" style="height:13px"></div><div class="bar" style="height:6px"></div></div></div>
          <span class="logo-name">Speakly</span><span class="plus-badge">Plus</span>
        </div>
        <div class="nav-section">
          <div class="nav-menu">
            <div class="nav-item"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 7.5L9 2l7 5.5V16H12v-5H6v5H2V7.5z" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/></svg>Home</div>
            <div class="nav-item"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="2" width="12" height="14" rx="2" stroke="#6b7280" stroke-width="1.5"/><path d="M6 7h6M6 10.5h4" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></svg>Dictionary</div>
            <div class="nav-item"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="2.5" stroke="#6b7280" stroke-width="1.5"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></svg>Custom Instructions</div>
            <div class="nav-item" style="background:#ecf3ff">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="6" y="2" width="6" height="9" rx="3" stroke="#3372fc" stroke-width="1.5"/><path d="M3 10c0 3.314 1.343 6 6 6s6-2.686 6-6" stroke="#3372fc" stroke-width="1.5" stroke-linecap="round"/><path d="M9 16v-1" stroke="#3372fc" stroke-width="1.5" stroke-linecap="round"/></svg>
              <span style="color:#3372fc;font-weight:600">Live Transcript</span>
            </div>
            <div class="nav-divider"></div>
            <div class="nav-item" style="background:#ebebeb"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="14" height="10" rx="2" stroke="#232425" stroke-width="1.5"/><path d="M6 15h6M9 13v2" stroke="#232425" stroke-width="1.5" stroke-linecap="round"/></svg>Meeting Notes</div>
          </div>
        </div>
      </div>
      <div class="sidebar-footer">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="#9ca3af" stroke-width="1.5"/><path d="M3 18c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="#9ca3af" stroke-width="1.5"/><circle cx="10" cy="10" r="2" fill="#9ca3af"/></svg>
      </div>
    </div>

    <!-- Working Panel -->
    <div class="working-panel">
      <!-- Header -->
      <div class="working-header">
        <div class="back-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 4L6 9l5 5" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="lang-pair">英语（美国）→ 中文（简体）</div>
        <div class="latency-badge">
          <div class="latency-dot"></div>
          45ms
        </div>
        <div style="width:1px;height:20px;background:#e5e7eb;margin:0 4px"></div>
        <div class="audio-source">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="4" y="1" width="5" height="7" rx="2.5" stroke="#6b7280" stroke-width="1.2"/><path d="M2 7c0 2.485 1.119 4.5 4.5 4.5S11 9.485 11 7" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/><path d="M6.5 11.5v-.5" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/></svg>
          MacBook 麦克风
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 5l3 3 3-3" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/></svg>
        </div>
      </div>

      <!-- Transcript Area (empty) -->
      <div class="transcript-area" style="display:flex;align-items:center;justify-content:center">
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px;color:#9ca3af">
          <div style="position:relative;width:72px;height:72px;display:flex;align-items:center;justify-content:center">
            <div style="position:absolute;width:72px;height:72px;border-radius:50%;border:2px solid #bfdbfe;opacity:0.5"></div>
            <div style="position:absolute;width:52px;height:52px;border-radius:50%;border:2px solid #93c5fd;opacity:0.6"></div>
            <div style="width:34px;height:34px;border-radius:50%;background:#3372fc;opacity:0.7;display:flex;align-items:center;justify-content:center">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="5" y="1" width="6" height="9" rx="3" fill="white"/><path d="M2 9c0 3.314 1.343 6 6 6s6-2.686 6-6" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
          </div>
          <div style="font-size:15px;font-weight:500;color:#6b7280">正在监听...</div>
          <div style="font-size:13px;color:#9ca3af">请开始说话，将会自动识别</div>
        </div>
      </div>

      <!-- Waveform -->
      <div class="waveform">
        <div class="wave-dot" style="width:5px;height:5px"></div>
        <div class="wave-dot" style="width:5px;height:7px"></div>
        <div class="wave-dot" style="width:5px;height:5px"></div>
        <div class="wave-dot" style="width:5px;height:9px"></div>
        <div class="wave-dot" style="width:5px;height:6px"></div>
        <div class="wave-dot" style="width:5px;height:5px"></div>
        <div class="wave-dot" style="width:5px;height:8px"></div>
        <div class="wave-dot" style="width:5px;height:11px"></div>
        <div class="wave-dot" style="width:5px;height:9px"></div>
        <div class="wave-dot" style="width:5px;height:14px"></div>
        <div class="wave-dot" style="width:5px;height:12px"></div>
        <div class="wave-dot" style="width:5px;height:16px"></div>
        <div class="wave-dot" style="width:5px;height:14px"></div>
        <div class="wave-dot" style="width:5px;height:10px"></div>
        <div class="wave-dot" style="width:5px;height:8px"></div>
        <div class="wave-dot" style="width:5px;height:6px"></div>
        <div class="wave-dot" style="width:5px;height:5px"></div>
        <div class="wave-dot" style="width:5px;height:7px"></div>
        <div class="wave-dot" style="width:5px;height:5px"></div>
        <div class="wave-dot" style="width:5px;height:9px"></div>
        <div class="wave-dot" style="width:5px;height:6px"></div>
        <div class="wave-dot" style="width:5px;height:5px"></div>
        <div class="wave-dot" style="width:5px;height:8px"></div>
        <div class="wave-dot" style="width:5px;height:5px"></div>
        <div class="wave-dot" style="width:5px;height:7px"></div>
        <div class="wave-dot" style="width:5px;height:5px"></div>
        <div class="wave-dot" style="width:5px;height:6px"></div>
        <div class="wave-dot" style="width:5px;height:5px"></div>
        <div class="wave-dot" style="width:5px;height:5px"></div>
        <div class="wave-dot" style="width:5px;height:6px"></div>
      </div>

      <!-- Bottom Toolbar -->
      <div class="bottom-toolbar">
        <div class="toolbar-btn">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2" y="5" width="18" height="12" rx="3" stroke="#6b7280" stroke-width="1.5"/><path d="M7 10h8M7 14h5" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>悬浮字幕</span>
        </div>
        <div class="toolbar-btn">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M19 5v10a2 2 0 01-2 2H5a2 2 0 01-2-2V5" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/><rect x="8" y="2" width="6" height="5" rx="1" stroke="#6b7280" stroke-width="1.5"/></svg>
          <span>保存</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
          <div class="mic-btn mic-btn-recording">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="7" y="2" width="8" height="11" rx="4" fill="white"/><path d="M4 12c0 3.866 3.134 7 7 7s7-3.134 7-7" stroke="white" stroke-width="1.8" stroke-linecap="round"/><path d="M11 19v1.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>
          </div>
          <div class="mic-timer">00:00</div>
        </div>
        <div class="toolbar-btn">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="3" stroke="#6b7280" stroke-width="1.5"/><path d="M11 2v2M11 18v2M2 11h2M18 11h2M4.9 4.9l1.4 1.4M15.7 15.7l1.4 1.4M4.9 17.1l1.4-1.4M15.7 6.3l1.4-1.4" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>同传设置</span>
        </div>
        <div class="toolbar-btn">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 3L9.5 8H4l4.5 3.3-1.7 5.2L11 13l4.2 3.5-1.7-5.2L18 8h-5.5L11 3z" stroke="#f97316" stroke-width="1.5" stroke-linejoin="round" fill="#fff7ed"/></svg>
          <span style="color:#f97316">AI 总结</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
