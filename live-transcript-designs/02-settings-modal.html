<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="shared.css"><script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script></head>
<body>
<div class="app-window">
  <div class="window-controls">
    <div class="tl tl-r"></div><div class="tl tl-y"></div><div class="tl tl-g"></div>
  </div>
  <div class="workspace">
    <div class="sidebar">
      <div class="sidebar-top">
        <div class="logo-area">
          <div class="logo-icon">
            <div class="logo-bars">
              <div class="bar" style="height:5px"></div><div class="bar" style="height:9px"></div>
              <div class="bar" style="height:7px"></div><div class="bar" style="height:13px"></div>
              <div class="bar" style="height:6px"></div>
            </div>
          </div>
          <span class="logo-name">Speakly</span>
          <span class="plus-badge">Plus</span>
        </div>
        <div class="nav-section">
          <div class="nav-menu">
            <div class="nav-item"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 7.5L9 2l7 5.5V16H12v-5H6v5H2V7.5z" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/></svg>Home</div>
            <div class="nav-item"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="2" width="12" height="14" rx="2" stroke="#6b7280" stroke-width="1.5"/><path d="M6 7h6M6 10.5h4" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></svg>Dictionary</div>
            <div class="nav-item"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="2.5" stroke="#6b7280" stroke-width="1.5"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></svg>Custom Instructions</div>
            <div class="nav-item" style="background:#ecf3ff">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="6" y="2" width="6" height="9" rx="3" stroke="#3372fc" stroke-width="1.5"/><path d="M3 10c0 3.314 1.343 6 6 6s6-2.686 6-6" stroke="#3372fc" stroke-width="1.5" stroke-linecap="round"/><path d="M9 16v-1" stroke="#3372fc" stroke-width="1.5" stroke-linecap="round"/></svg>
              <span style="color:#3372fc;font-weight:600">Live Transcript</span>
            </div>
            <div class="nav-divider"></div>
            <div class="nav-item" style="background:#ebebeb"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="14" height="10" rx="2" stroke="#232425" stroke-width="1.5"/><path d="M6 15h6M9 13v2" stroke="#232425" stroke-width="1.5" stroke-linecap="round"/></svg>Meeting Notes</div>
          </div>
        </div>
      </div>
      <div class="sidebar-footer">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="#9ca3af" stroke-width="1.5"/><path d="M3 18c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="#9ca3af" stroke-width="1.5"/><circle cx="10" cy="10" r="2" fill="#9ca3af"/></svg>
      </div>
    </div>

    <!-- Main Panel with modal overlay -->
    <div class="main-panel">
      <!-- Blurred background content -->
      <div class="panel-body" style="filter:blur(2px);pointer-events:none;opacity:0.5">
        <div style="margin-bottom:6px;font-size:22px;font-weight:700;color:#1c1d1f">Live Transcript</div>
        <div style="margin-bottom:28px;font-size:13px;color:#9ca3af">实时转录对话，跨语言实时同传</div>
        <div class="mode-cards">
          <div class="mode-card mode-card-realtime"><div class="mode-card-icon"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="7" y="2" width="8" height="12" rx="4" fill="white" opacity="0.9"/><path d="M3 12c0 4.418 1.79 8 8 8s8-3.582 8-8" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg></div><div class="mode-card-title">实时同传</div><div class="mode-card-sub">会议 / 面对面</div></div>
          <div class="mode-card mode-card-video"><div class="mode-card-icon"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2" y="5" width="13" height="10" rx="2.5" fill="white" opacity="0.9"/><path d="M15 9l5-3v10l-5-3V9z" fill="white" opacity="0.9"/></svg></div><div class="mode-card-title">视频同传</div><div class="mode-card-sub">网课 / 直播 / 视频</div></div>
        </div>
      </div>

      <!-- Modal Overlay -->
      <div class="overlay">
        <div class="modal" style="width:460px">
          <!-- Header with lang pair -->
          <div style="padding:22px 28px 18px;text-align:center;border-bottom:1px solid #f0f0f0">
            <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px">
              <span style="font-size:15px;font-weight:600;color:#1c1d1f">英语（美国）</span>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 10h12M12 6l4 4-4 4" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span style="font-size:15px;font-weight:600;color:#1c1d1f">中文（简体）</span>
            </div>
            <div style="font-size:12px;color:#9ca3af">实时同传设置</div>
          </div>

          <!-- Settings rows -->
          <div class="modal-row">
            <div class="modal-row-label">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="2" fill="#3372fc"/><circle cx="9" cy="9" r="6" stroke="#3372fc" stroke-width="1.5"/><path d="M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4" stroke="#3372fc" stroke-width="1.2"/></svg>
              <span>翻译引擎</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px">
              <span class="modal-row-value">请选择</span>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 6l3 3 3-3" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
          </div>
          <div class="modal-row">
            <div class="modal-row-label">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="6" y="2" width="6" height="9" rx="3" stroke="#3372fc" stroke-width="1.5"/><path d="M3 10c0 3.314 1.343 6 6 6s6-2.686 6-6" stroke="#3372fc" stroke-width="1.5" stroke-linecap="round"/></svg>
              <span>声音来源</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px">
              <span class="modal-row-value">英语（美国）</span>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 6l3 3 3-3" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
          </div>
          <div class="modal-row" style="border-bottom:none">
            <div class="modal-row-label">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="#3372fc" stroke-width="1.5"/><path d="M9 2C9 2 6 5 6 9s3 7 3 7M9 2c0 0 3 3 3 7s-3 7-3 7M2 9h14" stroke="#3372fc" stroke-width="1.2" stroke-linecap="round"/></svg>
              <span>目标语言</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px">
              <span class="modal-row-value">中文（简体）</span>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 6l3 3 3-3" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
          </div>

          <!-- Footer -->
          <div style="padding:16px 28px 22px;display:flex;flex-direction:column;gap:14px;border-top:1px solid #f5f5f5">
            <div style="display:flex;align-items:center;justify-content:center;gap:8px">
              <div style="width:32px;height:18px;background:#3372fc;border-radius:9px;position:relative">
                <div style="position:absolute;right:2px;top:2px;width:14px;height:14px;background:white;border-radius:50%"></div>
              </div>
              <span style="font-size:13px;color:#6b7280">记住设置</span>
            </div>
            <button class="btn-primary" style="width:100%;padding:14px;font-size:15px;border-radius:12px">
              开始同传
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
