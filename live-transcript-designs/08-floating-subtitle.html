<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="shared.css"><script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  body { background: #1a1a2e; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;align-items:center;gap:16px">
  <!-- Context label -->
  <div style="color:rgba(255,255,255,0.35);font-size:12px;letter-spacing:0.05em">悬浮字幕窗口（独立置顶显示）</div>

  <!-- Floating subtitle window -->
  <div class="float-window">
    <div class="float-controls">
      <div class="float-tl float-tl-r"></div>
      <div class="float-tl float-tl-y"></div>
      <div class="float-tl float-tl-g"></div>
      <div class="float-spacer"></div>
      <!-- Controls -->
      <div style="display:flex;align-items:center;gap:2px">
        <div class="float-control-btn">A+</div>
        <div class="float-control-btn">A-</div>
      </div>
      <div style="width:1px;height:16px;background:rgba(255,255,255,0.15);margin:0 8px"></div>
      <!-- Color swatches -->
      <div style="display:flex;align-items:center;gap:5px">
        <div style="width:14px;height:14px;border-radius:50%;background:white;border:2px solid rgba(255,255,255,0.6);cursor:pointer"></div>
        <div style="width:14px;height:14px;border-radius:50%;background:#fbbf24;cursor:pointer"></div>
        <div style="width:14px;height:14px;border-radius:50%;background:#34d399;cursor:pointer"></div>
        <div style="width:14px;height:14px;border-radius:50%;background:#60a5fa;cursor:pointer"></div>
      </div>
      <div style="width:1px;height:16px;background:rgba(255,255,255,0.15);margin:0 8px"></div>
      <!-- Toggle original -->
      <div class="float-toggle">
        <div style="width:28px;height:16px;background:rgba(255,255,255,0.25);border-radius:8px;position:relative;cursor:pointer">
          <div style="position:absolute;right:2px;top:2px;width:12px;height:12px;background:white;border-radius:50%"></div>
        </div>
        <span>原文</span>
      </div>
    </div>

    <div class="float-content">
      <div class="float-original">
        The new product launch in APAC markets has been particularly successful, driving strong adoption rates.
      </div>
      <div class="float-translated">
        亚太市场的新产品发布尤其成功，推动了强劲的采用率。
      </div>
    </div>
  </div>

  <!-- Compact variant label -->
  <div style="color:rgba(255,255,255,0.25);font-size:11px;margin-top:8px">↑ 可在任意窗口上方置顶显示</div>
</div>
</body></html>
