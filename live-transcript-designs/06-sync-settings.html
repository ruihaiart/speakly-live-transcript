<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="shared.css"><script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script></head>
<body>
<div class="app-window">
  <div class="window-controls">
    <div class="tl tl-r"></div><div class="tl tl-y"></div><div class="tl tl-g"></div>
  </div>
  <div class="workspace">
    <div class="sidebar">
      <div class="sidebar-top">
        <div class="logo-area">
          <div class="logo-icon"><div class="logo-bars"><div class="bar" style="height:5px"></div><div class="bar" style="height:9px"></div><div class="bar" style="height:7px"></div><div class="bar" style="height:13px"></div><div class="bar" style="height:6px"></div></div></div>
          <span class="logo-name">Speakly</span><span class="plus-badge">Plus</span>
        </div>
        <div class="nav-section">
          <div class="nav-menu">
            <div class="nav-item"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 7.5L9 2l7 5.5V16H12v-5H6v5H2V7.5z" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/></svg>Home</div>
            <div class="nav-item"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="2" width="12" height="14" rx="2" stroke="#6b7280" stroke-width="1.5"/></svg>Dictionary</div>
            <div class="nav-item"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="2.5" stroke="#6b7280" stroke-width="1.5"/></svg>Custom Instructions</div>
            <div class="nav-item" style="background:#ecf3ff"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="6" y="2" width="6" height="9" rx="3" stroke="#3372fc" stroke-width="1.5"/><path d="M3 10c0 3.314 1.343 6 6 6s6-2.686 6-6" stroke="#3372fc" stroke-width="1.5" stroke-linecap="round"/></svg><span style="color:#3372fc;font-weight:600">Live Transcript</span></div>
            <div class="nav-divider"></div>
            <div class="nav-item" style="background:#ebebeb"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="14" height="10" rx="2" stroke="#232425" stroke-width="1.5"/></svg>Meeting Notes</div>
          </div>
        </div>
      </div>
      <div class="sidebar-footer">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="#9ca3af" stroke-width="1.5"/><path d="M3 18c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="#9ca3af" stroke-width="1.5"/><circle cx="10" cy="10" r="2" fill="#9ca3af"/></svg>
      </div>
    </div>

    <div class="working-panel">
      <!-- Blurred background -->
      <div style="filter:blur(1px);opacity:0.55;flex:1;display:flex;flex-direction:column">
        <div class="working-header">
          <div class="back-btn"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 4L6 9l5 5" stroke="#6b7280" stroke-width="1.5"/></svg></div>
          <div class="lang-pair">英语（美国）→ 中文（简体）</div>
          <div class="latency-badge"><div class="latency-dot"></div>68ms</div>
        </div>
        <div class="transcript-area" style="flex:1">
          <div class="transcript-block"><div class="transcript-time">00:00</div><div class="transcript-original">Good morning everyone.</div><div class="transcript-translated">大家早上好。</div></div>
        </div>
      </div>

      <!-- Bottom Sheet -->
      <div class="bottom-sheet-overlay">
        <div class="bottom-sheet">
          <!-- Handle -->
          <div style="padding:12px;display:flex;justify-content:center">
            <div style="width:36px;height:4px;background:#e5e7eb;border-radius:2px"></div>
          </div>

          <!-- Font Settings -->
          <div style="padding:0 24px 16px">
            <div style="font-size:12px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px">字体设置</div>
            <div style="background:#f9f9f9;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:16px">
              <div style="display:flex;align-items:center;justify-content:space-between">
                <span style="font-size:14px;color:#1c1d1f">字体大小</span>
                <div style="display:flex;align-items:center;gap:12px">
                  <div style="width:32px;height:32px;border:1.5px solid #e5e7eb;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#6b7280;cursor:pointer">−</div>
                  <span style="font-size:15px;font-weight:600;color:#1c1d1f;min-width:24px;text-align:center">16</span>
                  <div style="width:32px;height:32px;border:1.5px solid #e5e7eb;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#6b7280;cursor:pointer">+</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between">
                <span style="font-size:14px;color:#1c1d1f">显示原文</span>
                <div style="width:36px;height:20px;background:#3372fc;border-radius:10px;position:relative;cursor:pointer">
                  <div style="position:absolute;right:2px;top:2px;width:16px;height:16px;background:white;border-radius:50%"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- AI Settings -->
          <div style="padding:0 24px 16px">
            <div style="font-size:12px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px">AI 同传设置</div>
            <div style="background:#f9f9f9;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:16px">
              <div style="display:flex;align-items:center;justify-content:space-between">
                <div>
                  <div style="font-size:14px;color:#1c1d1f;margin-bottom:2px">AI 精修模式</div>
                  <div style="font-size:12px;color:#9ca3af">自动优化译文准确度</div>
                </div>
                <div style="width:36px;height:20px;background:#3372fc;border-radius:10px;position:relative;cursor:pointer"><div style="position:absolute;right:2px;top:2px;width:16px;height:16px;background:white;border-radius:50%"></div></div>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between">
                <div>
                  <div style="font-size:14px;color:#1c1d1f;margin-bottom:2px">语音检测灵敏度</div>
                  <div style="font-size:12px;color:#9ca3af">标准</div>
                </div>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></svg>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between">
                <div>
                  <div style="font-size:14px;color:#1c1d1f;margin-bottom:2px">翻译引擎</div>
                  <div style="font-size:12px;color:#9ca3af">ChatGPT（高精度）</div>
                </div>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/></svg>
              </div>
            </div>
          </div>

          <!-- Cancel -->
          <div class="bottom-sheet-item cancel" style="border-top:1px solid #f0f0f0;margin-bottom:8px">取消</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
